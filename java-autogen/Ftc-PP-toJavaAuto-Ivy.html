<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pedro/Turtle Tracer Path → FTC Java Auto</title>
    <style>
        body {
            font-family: monospace;
            background: #0b1020;
            color: #e5e7eb;
            padding: 20px;
        }
        h1 { color: #60a5fa; }
        textarea {
            width: 100%;
            height: 700px;
            background: #020617;
            color: #e5e7eb;
            border: 1px solid #334155;
            padding: 12px;
            white-space: pre;
        }
        button {
            background: #60a5fa;
            border: none;
            padding: 8px 14px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Pedro Pathing / Turtle Tracer (.pp, .turt) → Java Generator</h1>

<details>
    <summary><strong>Settings</strong></summary>
    <div style="margin: 10px 0; padding: 10px; border: 1px solid #334155; background: #020617;">
        <label>Package Name:<br>
        <input type="text" id="packageName" placeholder="org.firstinspires.ftc.teamcode.pedroPathing" style="width: 100%; margin: 5px 0; padding: 5px; background: #0b1020; color: #e5e7eb; border: 1px solid #334155;"></label><br>
        
        <label>Class Name:<br>
        <input type="text" id="className" placeholder="Autonomous" style="width: 100%; margin: 5px 0; padding: 5px; background: #0b1020; color: #e5e7eb; border: 1px solid #334155;"></label><br>
        
        <label>OpMode Name:<br>
        <input type="text" id="opModeName" placeholder="Auto" style="width: 100%; margin: 5px 0; padding: 5px; background: #0b1020; color: #e5e7eb; border: 1px solid #334155;"></label><br>
        
        <label>OpMode Group:<br>
        <input type="text" id="opModeGroup" placeholder="Pedro" style="width: 100%; margin: 5px 0; padding: 5px; background: #0b1020; color: #e5e7eb; border: 1px solid #334155;"></label><br>
        
        <label>Constants File Package:<br>
        <input type="text" id="constantsPackage" placeholder="org.firstinspires.ftc.teamcode.pedroPathing" style="width: 100%; margin: 5px 0; padding: 5px; background: #0b1020; color: #e5e7eb; border: 1px solid #334155;"></label><br>

        <label style="display: inline-flex; align-items: center; gap: 8px; margin: 8px 0 12px;">
        <input type="checkbox" id="useIvyCommandBase" checked>
        Use Ivy command-base routine
        </label><br>
        
        <button onclick="saveSettings()" style="background: #10b981; margin-right: 10px;">Save Settings</button>
        <button onclick="resetSettings()" style="background: #ef4444;">Reset to Defaults</button>
    </div>
</details>

<input type="file" id="fileInput" accept=".pp,.turt,.json">
<br><br>
<button onclick="generate()">Generate Java</button>

<h2>Generated Java</h2>
<textarea id="output"></textarea>

<script src="./Ftc-PP-toJavaAuto-Ivy.js"></script>
<script>
const generator = globalThis.PedroPathingJavaGenerator;
const storageKey = "pedroPathingSettings";
let currentFileContent = "";

function applySettings(settings) {
    document.getElementById("packageName").value = settings.packageName;
    document.getElementById("constantsPackage").value = settings.constantsPackage;
    document.getElementById("className").value = settings.className;
    document.getElementById("opModeName").value = settings.opModeName;
    document.getElementById("opModeGroup").value = settings.opModeGroup;
    document.getElementById("useIvyCommandBase").checked = settings.useIvyCommandBase;
}

function loadSettings() {
    try {
        const savedSettings = localStorage.getItem(storageKey);
        const settings = savedSettings
            ? generator.normalizeSettings(JSON.parse(savedSettings))
            : generator.defaultSettings;

        applySettings(settings);
    } catch {
        applySettings(generator.defaultSettings);
    }
}

function getSettings() {
    return generator.normalizeSettings({
        packageName: document.getElementById("packageName").value,
        constantsPackage: document.getElementById("constantsPackage").value,
        className: document.getElementById("className").value,
        opModeName: document.getElementById("opModeName").value,
        opModeGroup: document.getElementById("opModeGroup").value,
        useIvyCommandBase: document.getElementById("useIvyCommandBase").checked
    });
}

function saveSettings() {
    const settings = getSettings();
    localStorage.setItem(storageKey, JSON.stringify(settings));
    applySettings(settings);
    alert("Settings saved!");
}

function resetSettings() {
    if (confirm("Reset all settings to defaults?")) {
        localStorage.removeItem(storageKey);
        applySettings(generator.defaultSettings);
        alert("Settings reset to defaults!");
    }
}

async function handleFileChange(event) {
    const [file] = event.target.files;
    if (!file) {
        currentFileContent = "";
        return;
    }

    try {
        currentFileContent = await file.text();
    } catch {
        currentFileContent = "";
        alert("Failed to read the selected file.");
    }
}

function generate() {
    if (!currentFileContent) {
        alert("Upload a .pp, .turt, or .json file first");
        return;
    }

    try {
        document.getElementById("output").value = generator.generate(currentFileContent, getSettings());
    } catch (error) {
        alert(error.message);
    }
}

document.getElementById("fileInput").addEventListener("change", handleFileChange);

window.saveSettings = saveSettings;
window.resetSettings = resetSettings;
window.generate = generate;

loadSettings();
</script>

</body>
</html>
